<app-header *ngIf="showHeaderFooter"></app-header>
<main id="main-content" class="page-transition">
  <router-outlet></router-outlet>
</main>
<app-footer *ngIf="showHeaderFooter"></app-footer>

<!-- Cookie Consent -->
<div class="cookie-banner" id="cookie-banner">
  <p class="text-body-sm">We use cookies to improve your experience. By continuing, you agree to our cookie policy.</p>
  <div class="d-flex gap-3 flex-shrink-0">
    <button class="btn btn-primary btn-sm" id="cookie-accept">Accept</button>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('cookie-banner').classList.remove('visible')">Decline</button>
  </div>
</div>
